name: YouTube trends

on:
  schedule:
    - cron: "47 0 * * *"
    - cron: "47 8 * * *"
    - cron: "47 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: youtube-trends
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: YouTube se data lao
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TRACK_DAYS: "10"
        run: python tracker.py

      - name: Data save karo
        run: |
          git config user.name "yt-trends-bot"
          git config user.email "yt-trends-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "trends update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
